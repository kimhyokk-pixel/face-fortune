<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재미로 보는 관상</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1d2671, #c33764);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 92%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    video, canvas {
      width: 100%;
      border-radius: 18px;
      margin-top: 15px;
      background: #111;
    }

    canvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startCameraBtn {
      background: #444;
      color: white;
    }

    #captureBtn {
      background: #0066ff;
      color: white;
      display: none;
    }

    #analyzeBtn {
      background: #222;
      color: white;
      display: none;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #f4f4f4;
      line-height: 1.7;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🔮 재미로 보는 관상</h1>

  <p>
    전면 카메라로 얼굴을 촬영해 보세요.
  </p>

  <button id="startCameraBtn">
    📷 카메라 켜기
  </button>

  <video id="video" autoplay playsinline></video>

  <button id="captureBtn">
    📸 사진 촬영
  </button>

  <canvas id="canvas"></canvas>

  <button id="analyzeBtn">
    🔮 내 관상 보기
  </button>

  <div id="result"></div>

  <div class="notice">
    ※ 재미를 위한 콘텐츠입니다.<br>
    실제 성격, 능력, 미래를 판단하지 않습니다.
  </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const startCameraBtn =
  document.getElementById("startCameraBtn");

const captureBtn =
  document.getElementById("captureBtn");

const analyzeBtn =
  document.getElementById("analyzeBtn");

const result =
  document.getElementById("result");

let stream = null;


/* 카메라 켜기 */
startCameraBtn.addEventListener("click", async () => {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    startCameraBtn.style.display = "none";
    captureBtn.style.display = "block";

  } catch (error) {

    alert(
      "카메라를 사용할 수 없습니다. 브라우저에서 카메라 권한을 허용해 주세요."
    );

  }

});


/* 사진 촬영 */
captureBtn.addEventListener("click", () => {

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.style.display = "block";
  video.style.display = "none";

  captureBtn.style.display = "none";
  analyzeBtn.style.display = "block";

});


/* 재미용 결과 */
const fortunes = [

  "✨ 오늘은 새로운 일에 도전하기 좋은 분위기입니다.",

  "🌿 차분하게 계획을 세우면 좋은 하루가 될 수 있어요.",

  "😊 주변 사람들과 즐겁게 이야기하면 좋은 일이 생길 수 있어요.",

  "💡 새로운 아이디어가 떠오르기 좋은 날입니다.",

  "🚀 작은 목표부터 하나씩 해보면 좋은 결과가 있을 수 있어요."

];


analyzeBtn.addEventListener("click", () => {

  const random =
    fortunes[
      Math.floor(Math.random() * fortunes.length)
    ];

  result.innerHTML =
    "<h2>오늘의 재미 관상</h2>" +
    "<p>" + random + "</p>";

  result.style.display = "block";

});

</script>

</body>
</html>
