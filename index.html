<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI 재미 관상</title>

  <style>
    body {
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #1d2671,
        #c33764
      );
    }

    .card {
      width: 380px;
      padding: 40px;

      text-align: center;

      background: white;

      border-radius: 25px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .sub {
      color: #666;
      margin-bottom: 30px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 30px;
    }

    .guide {
      font-size: 18px;
      font-weight: bold;
    }

    .small {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }

  </style>
</head>


<body>

<div class="card">

  <h1>🔮 AI 재미 관상</h1>

  <div class="sub">
    얼굴 사진으로 재미있는 관상을 확인해 보세요.
  </div>


  <div id="qrcode"></div>


  <div class="guide">
    📱 휴대폰으로 QR코드를 찍어주세요
  </div>


  <div class="small">
    ※ 재미를 위한 콘텐츠이며 실제 성격이나 운명을 판단하지 않습니다.
  </div>

</div>


<script src="
https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script>

  /*
  여기에 나중에 실제 웹사이트 주소를 넣습니다.
  
  예:
  
https://kimhyokk-pixel.github.io/face-fortune/face.html
  
  */

  const faceURL =
    "https://kimhyokk-pixel.github.io/face-fortune/face.html";


  new QRCode(
    document.getElementById("qrcode"),
    {
      text: faceURL,
      width: 220,
      height: 220
    }
  );

</script>

</body>
</html>
